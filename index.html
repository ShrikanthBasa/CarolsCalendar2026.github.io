
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carols Calendar 2026</title>

    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --bg: #f5f7fb;
            --surface: #ffffff;
            --border: #e5e7eb;
            --text: #1f2937;
            --muted: #6b7280;
            --danger: #dc2626;
            --shadow: 0 4px 20px rgba(0,0,0,.06);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        button, input, select, textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            max-width: 1450px;
            margin: auto;
            padding: 24px;
        }

        /* HEADER */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0;
            font-size: 27px;
        }

        .header p {
            color: var(--muted);
            margin: 6px 0 0;
            font-size: 13px;
        }

        .header-actions {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
        }

        .btn {
            border: 1px solid var(--border);
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            color: var(--text);
            font-weight: 600;
        }

        .btn:hover {
            background: #f3f4f6;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-danger {
            color: var(--danger);
            border-color: #fecaca;
        }

        /* TOOLBAR */

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 18px;
        }

        .month-navigation {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .month-navigation h2 {
            min-width: 190px;
            text-align: center;
            margin: 0;
            font-size: 21px;
        }

        .nav-btn {
            border: 1px solid var(--border);
            background: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            font-size: 20px;
        }

        .search-box {
            width: 260px;
            max-width: 100%;
            padding: 10px 13px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: white;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--primary);
        }

        /* CALENDAR */

        .calendar-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }

        .weekday {
            text-align: center;
            padding: 14px 5px;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            background: #f9fafb;
            border-bottom: 1px solid var(--border);
        }

        .day {
            min-height: 125px;
            padding: 9px;
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background .15s;
            min-width: 0;
        }

        .day:nth-child(7n) {
            border-right: none;
        }

        .day:hover {
            background: #f8fafc;
        }

        .day.other-month {
            background: #fafafa;
            color: #b8bdc7;
        }

        .day.today {
            background: #f0f6ff;
        }

        .day.selected {
            box-shadow: inset 0 0 0 2px var(--primary);
        }

        .day-number {
            font-size: 13px;
            font-weight: 700;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 27px;
            height: 27px;
            border-radius: 50%;
            margin-bottom: 5px;
        }

        .day.today .day-number {
            background: var(--primary);
            color: white;
        }

        .event {
            padding: 5px 7px;
            border-radius: 5px;
            margin-top: 4px;
            font-size: 11px;
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
            border-left: 3px solid;
        }

        .event:hover {
            filter: brightness(.96);
        }

        .event-time {
            font-weight: 700;
        }

        .event.school {
            background: #dbeafe;
            color: #1e40af;
            border-color: #2563eb;
        }

        .event.orphanage {
            background: #f3e8ff;
            color: #6b21a8;
            border-color: #9333ea;
        }

        .event.office {
            background: #dcfce7;
            color: #166534;
            border-color: #16a34a;
        }

        .event.other {
            background: #ffedd5;
            color: #9a3412;
            border-color: #ea580c;
        }

        .more-events {
            color: var(--muted);
            font-size: 11px;
            padding: 4px;
        }

        /* LEGEND */

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            padding: 15px 5px;
            font-size: 12px;
            color: var(--muted);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 9px;
            height: 9px;
            border-radius: 3px;
        }

        .status {
            font-size: 12px;
            color: var(--muted);
            margin-top: 12px;
            min-height: 18px;
        }

        .status.success {
            color: #15803d;
        }

        .status.error {
            color: var(--danger);
        }

        /* MODAL */

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .5);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 100;
        }

        .modal-backdrop.show {
            display: flex;
        }

        .modal {
            background: white;
            width: 100%;
            max-width: 510px;
            border-radius: 13px;
            padding: 23px;
            box-shadow: 0 15px 50px rgba(0,0,0,.2);
            max-height: 95vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .close-btn {
            border: none;
            background: none;
            font-size: 25px;
            color: var(--muted);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid var(--border);
            border-radius: 7px;
            outline: none;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 22px;
        }

        .modal-actions-right {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }

        button:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        /* MOBILE MONTH LIST: readable event titles instead of compressed calendar cells */
        .mobile-day-row {
            display: grid;
            grid-template-columns: 66px minmax(0, 1fr);
            gap: 10px;
            padding: 11px 12px;
            border-bottom: 1px solid var(--border);
            background: #fff;
            cursor: pointer;
        }

        .mobile-day-row:last-child { border-bottom: 0; }
        .mobile-day-row.today { background: #f0f6ff; }
        .mobile-date { display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .mobile-date strong { font-size: 18px; line-height: 1.2; }
        .mobile-date span { color: var(--muted); font-size: 11px; }
        .mobile-day-row.today .mobile-date strong { color: var(--primary); }
        .mobile-events { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
        .mobile-event {
            display: block;
            width: 100%;
            padding: 7px 9px;
            border-radius: 6px;
            border-left: 4px solid;
            font-size: 13px;
            line-height: 1.35;
            white-space: normal;
            overflow-wrap: anywhere;
            cursor: pointer;
        }
        .mobile-event .event-time { margin-right: 5px; }
        .mobile-empty { color: #9ca3af; font-size: 12px; padding: 6px 2px; }
        .mobile-add-hint { color: var(--primary); font-size: 11px; margin-top: 2px; }

        @media(max-width: 700px) {
            .app {
                padding: 12px;
            }

            .header h1 {
                font-size: 22px;
            }

            .toolbar {
                align-items: stretch;
            }

            .search-box {
                width: 100%;
            }

            .month-navigation {
                justify-content: space-between;
                width: 100%;
            }

            .month-navigation h2 {
                min-width: 0;
                font-size: 18px;
            }

            .calendar-container { border-radius: 9px; }
            .mobile-day-row { grid-template-columns: 56px minmax(0, 1fr); padding: 10px 9px; }
            .mobile-date strong { font-size: 17px; }
            .mobile-event { font-size: 13px; padding: 8px; }
            .legend { gap: 10px 14px; font-size: 11px; }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header class="header">
        <div>
            <h1>Carols Calendar 2026</h1>
            <p>And he said unto them, Go ye into all the world, and preach the gospel to every creature. Mark 16:15</p>
        </div>

        <div class="header-actions">
            <button class="btn" onclick="goToday()">Today</button>
            <button class="btn btn-primary" onclick="openAddModal()">
                + Add Event
            </button>
        </div>
    </header>

    <section class="toolbar">
        <div class="month-navigation">
            <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
            <h2 id="monthTitle"></h2>
            <button class="nav-btn" onclick="changeMonth(1)">›</button>
        </div>

        <input
                type="search"
                id="searchInput"
                class="search-box"
                placeholder="Search events..."
                oninput="renderCalendar()"
        >
    </section>

    <div class="calendar-container">
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="legend">
        <div class="legend-item">
            <span class="legend-dot" style="background:#2563eb"></span>
            School
        </div>
        <div class="legend-item">
            <span class="legend-dot" style="background:#9333ea"></span>
            Orphanage
        </div>
        <div class="legend-item">
            <span class="legend-dot" style="background:#16a34a"></span>
            Office
        </div>
        <div class="legend-item">
            <span class="legend-dot" style="background:#ea580c"></span>
            Other
        </div>
    </div>

    <div id="status" class="status">Connecting to calendar...</div>

</div>


<!-- EVENT MODAL -->

<div class="modal-backdrop" id="modalBackdrop">

    <div class="modal">

        <div class="modal-header">
            <h2 id="modalTitle">Add Event</h2>
            <button class="close-btn" onclick="closeModal()">×</button>
        </div>

        <form id="eventForm">

            <input type="hidden" id="eventId">

            <div class="form-group">
                <label for="eventName">Event Title *</label>
                <input
                        type="text"
                        id="eventName"
                        required
                        maxlength="120"
                        placeholder="Enter event title"
                >
            </div>

            <div class="form-group">
                <label for="eventDate">Date *</label>
                <input type="date" id="eventDate" required>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="startTime">Start Time</label>
                    <input type="time" id="startTime">
                </div>

                <div class="form-group">
                    <label for="endTime">End Time</label>
                    <input type="time" id="endTime">
                </div>

            </div>

            <div class="form-group">
                <label for="eventCategory">Category</label>
                <select id="eventCategory">
                    <option value="school">School</option>
                    <option value="orphanage">Orphanage</option>
                    <option value="office">Office</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="eventDescription">Description</label>
                <textarea
                        id="eventDescription"
                        maxlength="2000"
                        placeholder="Additional details..."
                ></textarea>
            </div>

            <div class="modal-actions">

                <button
                        type="button"
                        id="deleteBtn"
                        class="btn btn-danger"
                        onclick="deleteEvent()"
                        style="display:none"
                >
                    Delete
                </button>

                <div class="modal-actions-right">
                    <button
                            type="button"
                            class="btn"
                            onclick="closeModal()"
                    >
                        Cancel
                    </button>

                    <button
                            type="submit"
                            id="saveBtn"
                            class="btn btn-primary"
                    >
                        Save Event
                    </button>
                </div>

            </div>

        </form>

    </div>
</div>


<script>

    /* =====================================================
       CONFIGURATION
    ===================================================== */

    // Replace this with your actual Cloudflare Worker URL.
    const API_URL = "https://calendar-api.shrikanthbasa33.workers.dev";


    /* =====================================================
       APPLICATION DATA
    ===================================================== */

    let events = [];

    let currentDate = new Date();

    let selectedDate = null;

    let calendarPassword = null;

    let isSaving = false;

    const weekdays = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"
    ];

    const monthNames = [
        "January", "February", "March", "April",
        "May", "June", "July", "August",
        "September", "October", "November", "December"
    ];


    /* =====================================================
       UTILITIES
    ===================================================== */

    function localDateString(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");

        return `${year}-${month}-${day}`;
    }

    function formatTime(time) {
        if (!time) return "";

        const [hours, minutes] = time.split(":");
        const date = new Date();

        date.setHours(Number(hours), Number(minutes));

        return date.toLocaleTimeString([], {
            hour: "numeric",
            minute: "2-digit"
        });
    }

    function showStatus(message, type = "") {
        const status = document.getElementById("status");

        status.textContent = message;
        status.className = "status " + type;
    }

    function sortEvents(list) {
        return [...list].sort((a, b) => {
            const dateCompare = a.date.localeCompare(b.date);

            if (dateCompare !== 0) return dateCompare;

            return (a.startTime || "").localeCompare(b.startTime || "");
        });
    }

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[char]);
    }


    /* =====================================================
       LOAD EVENTS FROM GITHUB THROUGH WORKER
    ===================================================== */

    async function loadEvents() {

        showStatus("Loading events from GitHub...");

        try {

            const response = await fetch(API_URL, {
                method: "GET",
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error("Unable to load calendar data. HTTP " + response.status);
            }

            const text = await response.text();

            const data = JSON.parse(text);

            if (!Array.isArray(data)) {
                throw new Error("Calendar file must contain an event array.");
            }

            // Migrate older category values without losing existing events.
            const categoryMigration = {
                work: "school",
                meeting: "orphanage",
                personal: "office",
                school: "school",
                orphanage: "orphanage",
                office: "office",
                other: "other"
            };

            events = data.map(event => ({
                ...event,
                category: categoryMigration[event.category] || "other"
            }));

            renderCalendar();

            showStatus("Calendar loaded successfully.", "success");

        } catch (error) {

            console.error(error);

            showStatus(
                "Error loading calendar: " + error.message,
                "error"
            );

        }
    }


    /* =====================================================
       SAVE EVENTS TO GITHUB THROUGH WORKER
    ===================================================== */

    async function saveEvents() {

        if (isSaving) {
            throw new Error("A save operation is already in progress.");
        }

        if (!calendarPassword) {

            calendarPassword = prompt("Enter your calendar password:");

            if (!calendarPassword) {
                throw new Error("Save cancelled. Password is required.");
            }

        }

        isSaving = true;

        const saveButton = document.getElementById("saveBtn");

        if (saveButton) {
            saveButton.disabled = true;
            saveButton.textContent = "Saving...";
        }

        showStatus("Saving events to GitHub...");

        try {

            const response = await fetch(API_URL, {

                method: "POST",

                headers: {
                    "Content-Type": "text/plain",
                    "X-Calendar-Key": calendarPassword
                },

                body: JSON.stringify(events, null, 2)

            });

            const result = await response.json();

            if (response.status === 401) {

                calendarPassword = null;

                throw new Error("Incorrect calendar password. Please try again.");

            }

            if (!response.ok || !result.success) {

                throw new Error(
                    result.error || "Unable to save events."
                );

            }

            showStatus("All changes saved successfully to GitHub.", "success");

            return true;

        } finally {

            isSaving = false;

            if (saveButton) {
                saveButton.disabled = false;
                saveButton.textContent = "Save Event";
            }

        }

    }


    /* =====================================================
       CALENDAR RENDERING
    ===================================================== */

    function renderCalendar() {

        const grid = document.getElementById("calendarGrid");

        grid.innerHTML = "";

        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        document.getElementById("monthTitle").textContent =
            `${monthNames[month]} ${year}`;

        // Weekday headings

        weekdays.forEach(day => {

            const heading = document.createElement("div");

            heading.className = "weekday";
            heading.textContent = day.substring(0, 3);

            grid.appendChild(heading);

        });

        const firstDay = new Date(year, month, 1).getDay();

        const daysInMonth = new Date(year, month + 1, 0).getDate();

        const previousMonthDays = new Date(year, month, 0).getDate();

        const today = localDateString(new Date());

        const search = document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();

        // On phones, use a readable day-by-day month list so event names remain visible.
        if (window.matchMedia("(max-width: 700px)").matches) {
            for (let dayNumber = 1; dayNumber <= daysInMonth; dayNumber++) {
                const cellDate = new Date(year, month, dayNumber);
                const dateString = localDateString(cellDate);
                const row = document.createElement("div");
                row.className = "mobile-day-row";
                if (dateString === today) row.classList.add("today");

                const dateBlock = document.createElement("div");
                dateBlock.className = "mobile-date";
                dateBlock.innerHTML = `<strong>${dayNumber}</strong><span>${weekdays[cellDate.getDay()].slice(0, 3)}</span>`;
                row.appendChild(dateBlock);

                const eventBlock = document.createElement("div");
                eventBlock.className = "mobile-events";

                const dayEvents = sortEvents(events.filter(event => {
                    const matchesDate = event.date === dateString;
                    const matchesSearch = !search ||
                        String(event.title || "").toLowerCase().includes(search) ||
                        String(event.description || "").toLowerCase().includes(search);
                    return matchesDate && matchesSearch;
                }));

                if (dayEvents.length) {
                    dayEvents.forEach(event => {
                        const eventElement = document.createElement("div");
                        eventElement.className = `mobile-event event ${event.category || "other"}`;
                        const time = event.startTime ? formatTime(event.startTime) : "";
                        eventElement.innerHTML =
                            (time ? `<span class="event-time">${escapeHTML(time)}</span>` : "") +
                            escapeHTML(event.title);
                        eventElement.title = event.title || "";
                        eventElement.addEventListener("click", e => {
                            e.stopPropagation();
                            openEditModal(event.id);
                        });
                        eventBlock.appendChild(eventElement);
                    });
                } else {
                    const empty = document.createElement("div");
                    empty.className = "mobile-empty";
                    empty.textContent = search ? "No matching events" : "No events";
                    eventBlock.appendChild(empty);
                }

                row.appendChild(eventBlock);
                row.addEventListener("click", () => {
                    selectedDate = dateString;
                    openAddModal(dateString);
                });
                grid.appendChild(row);
            }
            return;
        }

        // Desktop/tablet: traditional 6-week month grid

        for (let i = 0; i < 42; i++) {

            let dayNumber;
            let cellDate;
            let otherMonth = false;

            if (i < firstDay) {

                dayNumber = previousMonthDays - firstDay + i + 1;

                cellDate = new Date(year, month - 1, dayNumber);

                otherMonth = true;

            } else if (i >= firstDay + daysInMonth) {

                dayNumber = i - firstDay - daysInMonth + 1;

                cellDate = new Date(year, month + 1, dayNumber);

                otherMonth = true;

            } else {

                dayNumber = i - firstDay + 1;

                cellDate = new Date(year, month, dayNumber);

            }

            const dateString = localDateString(cellDate);

            const day = document.createElement("div");

            day.className = "day";

            if (otherMonth) day.classList.add("other-month");

            if (dateString === today) day.classList.add("today");

            if (dateString === selectedDate) day.classList.add("selected");

            const number = document.createElement("div");

            number.className = "day-number";
            number.textContent = dayNumber;

            day.appendChild(number);

            // Events for this date

            const dayEvents = sortEvents(
                events.filter(event => {

                    const matchesDate = event.date === dateString;

                    const matchesSearch =
                        !search ||
                        String(event.title || "").toLowerCase().includes(search) ||
                        String(event.description || "").toLowerCase().includes(search);

                    return matchesDate && matchesSearch;

                })
            );

            dayEvents.slice(0, 3).forEach(event => {

                const eventElement = document.createElement("div");

                eventElement.className =
                    "event " + (event.category || "other");

                const time = event.startTime
                    ? formatTime(event.startTime) + " "
                    : "";

                eventElement.innerHTML =
                    `<span class="event-time">${escapeHTML(time)}</span>` +
                    escapeHTML(event.title);

                eventElement.title = event.title || "";

                // Stop date click when editing an event

                eventElement.addEventListener("click", e => {

                    e.stopPropagation();

                    openEditModal(event.id);

                });

                day.appendChild(eventElement);

            });

            if (dayEvents.length > 3) {

                const more = document.createElement("div");

                more.className = "more-events";

                more.textContent = `+ ${dayEvents.length - 3} more`;

                day.appendChild(more);

            }

            day.addEventListener("click", () => {

                selectedDate = dateString;

                openAddModal(dateString);

            });

            grid.appendChild(day);

        }

    }


    /* =====================================================
       MONTH NAVIGATION
    ===================================================== */

    function changeMonth(direction) {

        currentDate = new Date(
            currentDate.getFullYear(),
            currentDate.getMonth() + direction,
            1
        );

        renderCalendar();

    }

    function goToday() {

        currentDate = new Date();

        selectedDate = localDateString(currentDate);

        renderCalendar();

    }


    /* =====================================================
       MODAL HANDLING
    ===================================================== */

    function openAddModal(date = null) {

        document.getElementById("eventForm").reset();

        document.getElementById("eventId").value = "";

        document.getElementById("modalTitle").textContent = "Add Event";

        document.getElementById("deleteBtn").style.display = "none";

        document.getElementById("saveBtn").textContent = "Save Event";

        document.getElementById("eventDate").value =
            date || localDateString(new Date());

        document.getElementById("eventCategory").value = "school";

        document.getElementById("modalBackdrop").classList.add("show");

        document.getElementById("eventName").focus();

    }


    function openEditModal(id) {

        const event = events.find(item => String(item.id) === String(id));

        if (!event) return;

        document.getElementById("eventId").value = event.id;

        document.getElementById("eventName").value = event.title || "";

        document.getElementById("eventDate").value = event.date || "";

        document.getElementById("startTime").value = event.startTime || "";

        document.getElementById("endTime").value = event.endTime || "";

        document.getElementById("eventCategory").value =
            event.category || "other";

        document.getElementById("eventDescription").value =
            event.description || "";

        document.getElementById("modalTitle").textContent = "Edit Event";

        document.getElementById("deleteBtn").style.display = "inline-block";

        document.getElementById("saveBtn").textContent = "Update Event";

        document.getElementById("modalBackdrop").classList.add("show");

    }


    function closeModal() {

        if (isSaving) return;

        document.getElementById("modalBackdrop").classList.remove("show");

    }


    /* =====================================================
       ADD / UPDATE EVENT
    ===================================================== */

    document.getElementById("eventForm").addEventListener("submit", async e => {

        e.preventDefault();

        if (isSaving) return;

        const id = document.getElementById("eventId").value;

        const title = document.getElementById("eventName").value.trim();

        const date = document.getElementById("eventDate").value;

        const startTime = document.getElementById("startTime").value;

        const endTime = document.getElementById("endTime").value;

        const category = document.getElementById("eventCategory").value;

        const description = document
            .getElementById("eventDescription")
            .value.trim();

        if (!title || !date) {

            alert("Please enter an event title and date.");

            return;

        }

        if (startTime && endTime && endTime < startTime) {

            alert("End time cannot be earlier than start time.");

            return;

        }

        const oldEvents = events.map(event => ({ ...event }));

        const eventData = {

            id: id || (
                typeof crypto !== "undefined" && crypto.randomUUID
                    ? crypto.randomUUID()
                    : Date.now().toString() + Math.random().toString(16).slice(2)
            ),

            title,
            date,
            startTime,
            endTime,
            category,
            description

        };

        if (id) {

            events = events.map(event =>
                String(event.id) === String(id)
                    ? eventData
                    : event
            );

        } else {

            events.push(eventData);

        }

        events = sortEvents(events);

        renderCalendar();

        try {

            await saveEvents();

            closeModal();

        } catch (error) {

            events = oldEvents;

            renderCalendar();

            showStatus("Save failed: " + error.message, "error");

            alert("Could not save event:\n" + error.message);

        }

    });


    /* =====================================================
       DELETE EVENT
    ===================================================== */

    async function deleteEvent() {

        if (isSaving) return;

        const id = document.getElementById("eventId").value;

        if (!id) return;

        const confirmed = confirm(
            "Are you sure you want to delete this event?"
        );

        if (!confirmed) return;

        const oldEvents = events.map(event => ({ ...event }));

        events = events.filter(
            event => String(event.id) !== String(id)
        );

        renderCalendar();

        try {

            await saveEvents();

            closeModal();

        } catch (error) {

            events = oldEvents;

            renderCalendar();

            showStatus("Delete failed: " + error.message, "error");

            alert("Could not delete event:\n" + error.message);

        }

    }


    /* =====================================================
       CLOSE MODAL ON BACKDROP CLICK
    ===================================================== */

    document.getElementById("modalBackdrop").addEventListener("click", e => {

        if (e.target.id === "modalBackdrop") {
            closeModal();
        }

    });


    /* =====================================================
       INITIALIZE
    ===================================================== */

    // Re-render when switching between mobile and desktop layouts.
    window.addEventListener("resize", renderCalendar);

    loadEvents();

</script>

</body>
</html>
