<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carols Calendar 2026</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
    <header class="header">
        <div class="brand">
            <svg class="brand-logo" viewBox="0 0 64 64" role="img" aria-label="Carols Calendar logo">
                <defs>
                    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#0f172a"/>
                        <stop offset="100%" stop-color="#1e293b"/>
                    </linearGradient>
                    <linearGradient id="treeGradient" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#22c55e"/>
                        <stop offset="100%" stop-color="#15803d"/>
                    </linearGradient>
                </defs>
                <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bgGradient)"/>
                <circle cx="15" cy="18" r="1.5" fill="#fff" opacity=".6"/>
                <circle cx="49" cy="22" r="1.5" fill="#fff" opacity=".6"/>
                <circle cx="13" cy="36" r="1" fill="#fff" opacity=".4"/>
                <circle cx="51" cy="38" r="1" fill="#fff" opacity=".4"/>
                <rect x="28" y="48" width="8" height="7" rx="1.5" fill="#92400e"/>
                <path d="M32 14 L19 29 H25 L16 40 H23 L13 50 H51 L41 40 H48 L39 29 H45 Z" fill="url(#treeGradient)"/>
                <path d="M27 26 h10 M24 35 h6 m4 0 h6 M21 44 h6 m4 0 h6" stroke="#dcfce7" stroke-width="2.5"
                      stroke-linecap="round" opacity=".85"/>
                <circle cx="24" cy="31" r="2" fill="#ef4444"/>
                <circle cx="41" cy="37" r="2" fill="#fbbf24"/>
                <circle cx="29" cy="41" r="2" fill="#ef4444"/>
                <circle cx="44" cy="46" r="2" fill="#ef4444"/>
                <path d="M32 6 l1.8 4.1 4.4.4-3.3 2.9 1 4.3-3.9-2.3-3.9 2.3 1-4.3-3.3-2.9 4.4-.4z" fill="#fbbf24"/>
            </svg>
            <div class="brand-text"><h1>Carols Calendar 2026</h1>
                <p>Mat 28:19 · Go ... teach all nations</p></div>
        </div>
        <div class="header-actions">
            <nav class="page-nav" aria-label="Main navigation"><a class="page-link active" href="index.html">📅
                Calendar</a><a class="page-link" href="songs.html">♫ Songs</a></nav>
        </div>
    </header>
    <section class="toolbar">
        <div class="month-navigation">
            <button class="nav-btn" onclick="changeMonth(-1)" aria-label="Previous month">‹</button>
            <h2 id="monthTitle"></h2>
            <button class="nav-btn" onclick="changeMonth(1)" aria-label="Next month">›</button>
        </div>
        <input type="search" id="searchInput" class="search-box" placeholder="Search events..."
               oninput="renderCalendar()"></section>
    <div class="calendar-container">
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>
    <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:#2563eb"></span>School</div>
        <div class="legend-item"><span class="legend-dot" style="background:#9333ea"></span>Orphanage</div>
        <div class="legend-item"><span class="legend-dot" style="background:#ea580c"></span>Old Age Home</div>
        <div class="legend-item"><span class="legend-dot" style="background:#16a34a"></span>Office</div>
        <div class="legend-item"><span class="legend-dot" style="background:#0d9488"></span>Society</div>
        <div class="legend-item"><span class="legend-dot" style="background:#6b7280"></span>Others</div>
    </div>
    <div id="status" class="status">Connecting to calendar...</div>
</div>
<div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
        <div class="modal-header"><h2 id="modalTitle">Add Event</h2>
            <button class="close-btn" onclick="closeModal()">×</button>
        </div>
        <form id="eventForm"><input type="hidden" id="eventId">
            <div class="form-group"><label for="eventName">Event Title *</label><input type="text" id="eventName"
                                                                                       required maxlength="120"
                                                                                       placeholder="Enter event title">
            </div>
            <div class="form-group"><label for="eventDate">Date *</label><input type="date" id="eventDate" required>
            </div>
            <div class="form-row">
                <div class="form-group"><label for="startTime">Start Time</label><input type="time" id="startTime">
                </div>
                <div class="form-group"><label for="endTime">End Time</label><input type="time" id="endTime"></div>
            </div>
            <div class="form-group"><label for="eventCategory">Category</label><select id="eventCategory">
                <option value="school">School</option>
                <option value="orphanage">Orphanage</option>
                <option value="oldagehome">Old Age Home</option>
                <option value="office">Office</option>
                <option value="society">Society</option>
                <option value="other">Others</option>
            </select></div>
            <div class="form-group"><label for="eventDescription">Description</label><textarea id="eventDescription"
                                                                                               maxlength="2000"
                                                                                               placeholder="Additional details..."></textarea>
            </div>
            <div class="modal-actions">
                <button type="button" id="deleteBtn" class="btn btn-danger" onclick="deleteEvent()"
                        style="display:none">Delete
                </button>
                <div class="modal-actions-right">
                    <button type="button" class="btn" onclick="closeModal()">Cancel</button>
                    <button type="submit" id="saveBtn" class="btn btn-primary">Save Event</button>
                </div>
            </div>
        </form>
    </div>
</div>
<script src="calendar.js"></script>
</body>
</html>
