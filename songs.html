<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carol Songs | Carols Calendar 2026</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
    <header class="header">
        <div class="brand">
            <svg class="brand-logo" viewBox="0 0 64 64" role="img" aria-label="Carols Calendar logo">
                <rect x="3" y="3" width="58" height="58" rx="16" fill="#0f172a"/>
                <path d="M32 14 L19 29 H25 L16 40 H23 L13 50 H51 L41 40 H48 L39 29 H45 Z" fill="#22c55e"/>
                <rect x="28" y="48" width="8" height="7" fill="#92400e"/>
                <path d="M32 6 l2 5 5 .5-4 3 1 5-4-2.5-4 2.5 1-5-4-3 5-.5z" fill="#fbbf24"/>
            </svg>
            <div class="brand-text"><h1>Carols Calendar 2026</h1>
                <p>Mat 28:19 · Go ... teach all nations</p></div>
        </div>
        <div class="header-actions">
            <nav class="page-nav" aria-label="Main navigation"><a class="page-link" href="index.html">📅 Calendar</a><a
                    class="page-link active" href="songs.html">♫ Songs</a></nav>
        </div>
    </header>
    <main class="songs-layout">
        <aside class="song-panel">
            <div class="song-panel-header"><h2>Carol Songs</h2>
                <input class="song-search" id="songSearch" type="search" placeholder="Find a song..." aria-label="Search songs">
            </div>
            <div class="song-list" id="songList"></div>
        </aside>
        <section class="lyrics-panel">
            <div class="lyrics-panel-inner" id="lyricsPanel">
                <div class="lyrics-placeholder">
                    <div class="icon">🎵</div>
                    <h2>Choose a song</h2>
                    <p>Select a carol from the list to display its lyrics here.</p></div>
            </div>
        </section>
    </main>
</div>
<script src="songs.js"></script>
</body>
</html>
